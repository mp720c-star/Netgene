name = "proud-bread-5014"
main = "workers/platform-preview.js"
compatibility_date = "2024-12-30"

# Branch preview only. Production publishes of this branch are refused by
# scripts/wrangler-proxy.mjs. The placeholder D1 id is replaced during a
# Cloudflare build when an API token is present. Local `wrangler dev` keeps it.
[build]
command = "node ./scripts/prepare-platform-preview.mjs"

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "platform-preview-shared"
database_id = "00000000-0000-0000-0000-000000000000"

# Worker Previews do not inherit top-level bindings.
[[previews.d1_databases]]
binding = "DB"
database_name = "platform-preview-shared"
database_id = "00000000-0000-0000-0000-000000000000"
