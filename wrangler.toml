name = "proud-bread-5014"
main = "workers/platform-preview.js"
compatibility_date = "2024-12-30"

# Branch preview only. The home screen in ./site is already built.
# scripts/wrangler-proxy.mjs uploads a preview version and does not publish production.
# A Cloudflare token replaces the placeholder D1 id; otherwise the preview uses its worker store.

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/api/*"]


# Worker Previews do not inherit top-level bindings.

[vars]
PREVIEW_STORE = "memory"
