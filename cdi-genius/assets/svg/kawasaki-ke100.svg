<?xml version="1.0" encoding="UTF-8"?>
<svg id="kawasaki-ke100" xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220">
  <rect x="20" y="40" rx="12" ry="12" width="320" height="140" fill="#fff" stroke="#222" stroke-width="3"/>
  <!-- keyway -->
  <rect x="160" y="18" width="40" height="26" rx="5" fill="#222"/>
  <!-- pins in two rows -->
  <g id="pins">
    <circle id="pin-1" cx="110" cy="90" r="14" fill="#000000" stroke="#333"/>
    <circle id="pin-2" cx="250" cy="90" r="14" fill="#ffeb3b" stroke="#333"/>
    <circle id="pin-3" cx="110" cy="140" r="14" fill="#3f51b5" stroke="#333"/>
    <circle id="pin-4" cx="250" cy="140" r="14" fill="#607d8b" stroke="#333"/>
    <text x="110" y="170" font-family="Arial" font-size="12" fill="#111" text-anchor="middle">1</text>
    <text x="250" y="170" font-family="Arial" font-size="12" fill="#111" text-anchor="middle">2</text>
    <text x="110" y="190" font-family="Arial" font-size="12" fill="#111" text-anchor="middle">3</text>
    <text x="250" y="190" font-family="Arial" font-size="12" fill="#111" text-anchor="middle">4</text>
  </g>
  <g transform="translate(12,12)"><text x="0" y="0" font-family="Arial" font-size="13" fill="#111">KAWASAKI KE100 (illustrative)</text></g>
</svg>
