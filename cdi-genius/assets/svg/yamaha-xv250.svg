<?xml version="1.0" encoding="UTF-8"?>
<svg id="yamaha-xv250" xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220">
  <!-- Connector body -->
  <rect x="20" y="40" rx="18" ry="18" width="560" height="140" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <!-- Keyway notch -->
  <rect x="280" y="20" width="40" height="30" rx="6" fill="#222"/>
  <!-- Pins (6) horizontally centered -->
  <g id="pins" transform="translate(0,0)">
    <!-- calculate spacing manually -->
    <circle id="pin-1" cx="80"  cy="110" r="14" fill="#000000" stroke="#333"/>
    <circle id="pin-2" cx="170" cy="110" r="14" fill="#ffeb3b" stroke="#333"/>
    <circle id="pin-3" cx="260" cy="110" r="14" fill="#0000ff" stroke="#333"/>
    <circle id="pin-4" cx="350" cy="110" r="14" fill="#ff5722" stroke="#333"/>
    <circle id="pin-5" cx="440" cy="110" r="14" fill="#4caf50" stroke="#333"/>
    <circle id="pin-6" cx="530" cy="110" r="14" fill="#9e9e9e" stroke="#333"/>
    <!-- pin labels -->
    <text x="80"  y="150" font-family="Arial" font-size="12" fill="#111" text-anchor="middle">1</text>
    <text x="170" y="150" font-family="Arial" font-size="12" fill="#111" text-anchor="middle">2</text>
    <text x="260" y="150" font-family="Arial" font-size="12" fill="#111" text-anchor="middle">3</text>
    <text x="350" y="150" font-family="Arial" font-size="12" fill="#111" text-anchor="middle">4</text>
    <text x="440" y="150" font-family="Arial" font-size="12" fill="#111" text-anchor="middle">5</text>
    <text x="530" y="150" font-family="Arial" font-size="12" fill="#111" text-anchor="middle">6</text>
  </g>
  <!-- legend -->
  <g id="legend" transform="translate(20,12)">
    <text x="0" y="0" font-family="Arial" font-size="13" fill="#111">YAMAHA XV250 (illustrative)</text>
  </g>
</svg>
