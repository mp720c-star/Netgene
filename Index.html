<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Genius - Offline iPhone App</title>
<style>
body { font-family: system-ui; background: #0b0b0f; color: white; margin:0; padding:20px; }
h1,h2 { text-align:center; }
section { margin-bottom:20px; }
button { padding:12px; margin-top:10px; width:100%; font-size:16px; }
select, input, textarea { width:100%; padding:12px; margin-top:10px; font-size:16px; }
textarea { height:80px; }
#videoElement { width:100%; margin-top:10px; border:1px solid #444; }
#history { background:#111; padding:10px; max-height:200px; overflow-y:auto; }
</style>
</head>
<body>

<h1>Vehicle Genius</h1>

<section>
  <h2>Vehicle Configuration</h2>
  <select id="vehicleType">
    <option value="">-- Select Vehicle Type --</option>
    <option value="Car/Truck">Car / Truck</option>
    <option value="Dirt Bike/Moto">Dirt Bike / Moto</option>
    <option value="ATV/4-Wheeler">4-Wheeler / ATV</option>
  </select>

  <select id="vehicleBrand">
    <option value="">-- Select Brand --</option>
  </select>

  <select id="vehicleModel">
    <option value="">-- Select Model --</option>
  </select>
</section>

<section>
  <h2>AI Mechanic Assistant</h2>
  <textarea id="symptom" placeholder="Describe the problem (e.g., 'won't start', 'squeaking')"></textarea>
  <button id="voiceBtn">🎤 Record Symptom</button>
  <button id="diagnoseBtn">Diagnose</button>
</section>

<section>
  <h2>Camera Input</h2>
  <video id="videoElement" autoplay playsinline></video>
  <button id="startCameraBtn">Start Camera</button>
</section>

<section>
  <h2>Diagnosis Results</h2>
  <div id="results">No diagnosis yet.</div>
</section>

<section>
  <h2>History</h2>
  <div id="history">No previous diagnoses.</div>
</section>
