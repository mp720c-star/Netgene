name: atdd-ios-testflight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed build to TestFlight
        type: boolean
        default: true
      marketing_version:
        description: iOS marketing version
        type: string
        default: "1.2.0"
  push:
    branches: [main]
    paths:
      - .github/atdd-testflight-upload-2

permissions:
  contents: read

concurrency:
  group: atdd-ios-testflight
  cancel-in-progress: false

env:
  # Build the branch selected in Run workflow. That branch holds the ATDD Connect source.
  BUNDLE_ID: com.netgene.atdd.ble
  EXPECTED_PROFILE_UUID: ce2e5ad5-a404-44da-9d64-18e53beb419b
  WORKSPACE: atdd/ios/ios/App/App.xcworkspace

jobs:
  build-and-upload:
    name: Archive ATDD Connect
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out ATDD Connect
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the iOS SDK and release version
        env:
          MARKETING_VERSION: ${{ inputs.marketing_version || '1.2.0' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f atdd/ios/package.json
          test -f atdd/ios/package-lock.json
          grep -q 'registerPlugin("BluetoothLe")' atdd/web/js/capacitor-ble-transport.js
          grep -q '@capacitor-community/bluetooth-le' atdd/ios/package.json
          grep -q 'CapacitorCommunityBluetoothLe' atdd/ios/ios/App/Podfile
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          test "$(printf '%s' "$sdk" | cut -d. -f1)" -ge 26
          if [[ ! "$MARKETING_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Marketing version is missing or invalid."
            exit 1
          fi
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER"
          echo "MARKETING_VERSION=$MARKETING_VERSION"

      - name: Sync Capacitor and install iOS dependencies
        working-directory: atdd/ios
        run: |
          set -euo pipefail
          npm ci
          test -d node_modules/@capacitor-community/bluetooth-le
          test -d node_modules/@capacitor/ios
          npm run sync:ios
          grep -q 'registerPlugin("BluetoothLe")' ios/App/App/public/js/capacitor-ble-transport.js

      - name: Import the distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}

      - name: Install the matching App Store provisioning profile
        id: profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          profile="$RUNNER_TEMP/atdd.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | /usr/bin/base64 -D > "$profile"
          security cms -D -i "$profile" > "$RUNNER_TEMP/atdd-profile.plist"
          python3 - <<'PY'
          import datetime
          import os
          import pathlib
          import plistlib
          import shutil

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          with (temp / "atdd-profile.plist").open("rb") as stream:
              profile = plistlib.load(stream)
          team = os.environ["IOS_TEAM_ID"]
          bundle = os.environ["BUNDLE_ID"]
          if (profile["UUID"] != os.environ["EXPECTED_PROFILE_UUID"]
                  or team not in profile["TeamIdentifier"]
                  or profile["Entitlements"]["application-identifier"] != f"{team}.{bundle}"
                  or profile["ExpirationDate"] <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)):
              raise SystemExit("The profile does not match this ATDD release or has expired.")
          destination = pathlib.Path.home() / "Library/Developer/Xcode/UserData/Provisioning Profiles"
          destination.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(temp / "atdd.mobileprovision", destination / (profile["UUID"] + ".mobileprovision"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"name={profile['Name']}", file=output)
          PY

      - name: Configure signing on the app target and archive
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
          MARKETING_VERSION: ${{ inputs.marketing_version || '1.2.0' }}
        run: |
          set -euo pipefail
          if ! ruby -rxcodeproj -e 'exit' 2>/dev/null; then
            gem install --user-install --no-document xcodeproj -v 1.27.0
          fi
          ruby -rxcodeproj - <<'RUBY'
          project = Xcodeproj::Project.open('atdd/ios/ios/App/App.xcodeproj')
          app = project.targets.find { |target| target.name == 'App' && target.product_type == 'com.apple.product-type.application' }
          abort 'ATDD app target missing' unless app
          release = app.build_configurations.find { |config| config.name == 'Release' }
          abort 'Release configuration missing' unless release
          settings = release.build_settings
          abort 'Bundle ID mismatch' unless settings['PRODUCT_BUNDLE_IDENTIFIER'] == ENV.fetch('BUNDLE_ID')
          version = ENV.fetch('MARKETING_VERSION')
          abort 'Marketing version missing' unless version.match?(/\A[0-9]+(\.[0-9]+){0,2}\z/)
          settings.update(
            'DEVELOPMENT_TEAM' => ENV.fetch('IOS_TEAM_ID'),
            'CODE_SIGN_STYLE' => 'Manual',
            'CODE_SIGN_IDENTITY[sdk=iphoneos*]' => 'Apple Distribution',
            'PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]' => ENV.fetch('PROFILE_NAME'),
            'MARKETING_VERSION' => version,
            'CURRENT_PROJECT_VERSION' => ENV.fetch('GITHUB_RUN_NUMBER')
          )
          project.save
          RUBY
          xcodebuild -workspace "$WORKSPACE" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ATDDConnect.xcarchive" archive

      - name: Export the signed iPhone build
        id: export
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import plistlib

          options = {
              "method": "app-store-connect",
              "destination": "export",
              "signingStyle": "manual",
              "teamID": os.environ["IOS_TEAM_ID"],
              "provisioningProfiles": {os.environ["BUNDLE_ID"]: os.environ["PROFILE_NAME"]},
              "manageAppVersionAndBuildNumber": False,
              "uploadSymbols": True,
          }
          with (pathlib.Path(os.environ["RUNNER_TEMP"]) / "ExportOptions.plist").open("wb") as stream:
              plistlib.dump(options, stream)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ATDDConnect.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          files=("$RUNNER_TEMP"/ipa/*.ipa)
          test "${#files[@]}" -eq 1
          test -f "${files[0]}"
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload the verified build to TestFlight
        if: ${{ github.event_name == 'push' || inputs.upload }}
        uses: apple-actions/upload-testflight-build@v2
        with:
          app-path: ${{ steps.export.outputs.path }}
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY }}

      - name: Record Apple processing status
        if: ${{ github.event_name == 'push' || inputs.upload }}
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          MARKETING_VERSION: ${{ inputs.marketing_version || '1.2.0' }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require("node:crypto");
          const bundleId = process.env.BUNDLE_ID;
          const buildNumber = process.env.GITHUB_RUN_NUMBER;
          const marketingVersion = process.env.MARKETING_VERSION;

          function pem() {
            let key = process.env.ASC_PRIVATE_KEY || "";
            if (!key.includes("BEGIN")) {
              key = Buffer.from(key, "base64").toString("utf8");
            }
            return key.replace(/\\n/g, "\n");
          }

          function token() {
            const header = Buffer.from(JSON.stringify({
              alg: "ES256",
              kid: process.env.ASC_KEY_ID,
              typ: "JWT",
            })).toString("base64url");
            const now = Math.floor(Date.now() / 1000);
            const body = Buffer.from(JSON.stringify({
              iss: process.env.ASC_ISSUER_ID,
              iat: now,
              exp: now + 600,
              aud: "appstoreconnect-v1",
            })).toString("base64url");
            const data = `${header}.${body}`;
            const signature = crypto.sign("SHA256", Buffer.from(data), {
              key: pem(),
              dsaEncoding: "ieee-p1363",
            });
            return `${data}.${signature.toString("base64url")}`;
          }

          async function asc(path, jwt) {
            const response = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
              headers: { Authorization: `Bearer ${jwt}` },
            });
            const text = await response.text();
            if (!response.ok) {
              const error = new Error(`App Store Connect returned HTTP ${response.status}`);
              error.status = response.status;
              throw error;
            }
            return JSON.parse(text);
          }

          function report(state, detail) {
            console.log(`APPLE_PROCESSING_STATE=${state}`);
            console.log(`APPLE_BUILD_NUMBER=${buildNumber}`);
            console.log(`MARKETING_VERSION=${marketingVersion}`);
            if (detail) console.log(detail);
          }

          (async () => {
            const apps = await asc(`/v1/apps?filter[bundleId]=${encodeURIComponent(bundleId)}&limit=1`, token());
            const app = apps.data && apps.data[0];
            if (!app) {
              report("APP_NOT_FOUND", `No App Store Connect app for ${bundleId}`);
              return;
            }
            const deadline = Date.now() + 12 * 60 * 1000;
            let last = "NOT_YET_LISTED";
            let uploaded = "";
            while (Date.now() < deadline) {
              const builds = await asc(
                `/v1/builds?filter[app]=${app.id}&filter[version]=${encodeURIComponent(buildNumber)}&sort=-uploadedDate&limit=5`,
                token(),
              );
              const match = (builds.data || []).find((item) => item.attributes && item.attributes.version === buildNumber);
              if (match) {
                last = match.attributes.processingState || "UNKNOWN";
                uploaded = match.attributes.uploadedDate || "";
                if (last !== "PROCESSING") break;
              }
              await new Promise((resolve) => setTimeout(resolve, 20000));
            }
            report(last, uploaded ? `APPLE_UPLOADED_DATE=${uploaded}` : "Build is not listed yet.");
          })().catch((error) => {
            report("UNKNOWN", `APPLE_STATUS_ERROR=${error.message}`);
            process.exitCode = 0;
          });
          NODE
