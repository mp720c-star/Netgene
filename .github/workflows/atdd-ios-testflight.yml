# Signed ATDD Connect IPA → TestFlight (App Store Connect).
# Requires repository secrets (see docs/status-board/ATDD-TESTFLIGHT-CI-SECRETS.md).
# Manual only — never auto-uploads on every push.
name: atdd-ios-testflight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload IPA to TestFlight after a successful archive (keep false until BLE/Wi-Fi verified)
        type: boolean
        default: false
      marketing_version:
        description: CFBundleShortVersionString (e.g. 1.2.0)
        type: string
        default: "1.2.0"

concurrency:
  group: atdd-ios-testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  BUNDLE_ID: com.netgene.atdd.ble
  # Expected App Store profile (ATDD Connect AppStore) — UUID is not a secret.
  EXPECTED_PROFILE_UUID: ce2e5ad5-a404-44da-9d64-18e53beb419b
  EXPECTED_TEAM_ID: AJ2FB298SY
  SCHEME: App
  WORKSPACE: atdd/ios/ios/App/App.xcworkspace

jobs:
  secrets-gate:
    name: Require TestFlight secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check required secret names are configured
        id: check
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            ASC_ISSUER_ID \
            ASC_KEY_ID \
            ASC_PRIVATE_KEY \
            IOS_TEAM_ID \
            IOS_DISTRIBUTION_P12_BASE64 \
            IOS_DISTRIBUTION_P12_PASSWORD \
            IOS_PROVISION_PROFILE_BASE64
          do
            eval "val=\${$name-}"
            if [[ -z "$val" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            echo "Add them at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "Guide: docs/status-board/ATDD-TESTFLIGHT-CI-SECRETS.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "All required TestFlight secret names are present (values not logged)."

  build-and-upload:
    name: Archive + TestFlight upload
    needs: secrets-gate
    if: needs.secrets-gate.outputs.ready == 'true'
    # macos-13: macos-14/latest returned "configuration not supported" on this repo.
    runs-on: macos-13
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Select Xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: Run ATDD automated tests
        working-directory: atdd
        run: npm test

      - name: Sync Capacitor www + iOS
        working-directory: atdd/ios
        run: |
          set -euo pipefail
          npm ci
          npm run sync:ios

      - name: CocoaPods install
        working-directory: atdd/ios/ios/App
        run: |
          set -euo pipefail
          pod install --repo-update

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}

      - name: Install provisioning profile
        id: profile
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$RUNNER_TEMP/atdd-connect.mobileprovision"
          echo -n "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)
          TEAM=$(security cms -D -i "$PROFILE_PATH" | plutil -extract TeamIdentifier.0 raw -)
          APPID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Entitlements.application-identifier raw -)
          if [[ "$UUID" != "$EXPECTED_PROFILE_UUID" ]]; then
            echo "::error::Profile UUID mismatch: got $UUID expected $EXPECTED_PROFILE_UUID"
            exit 1
          fi
          if [[ "$TEAM" != "$EXPECTED_TEAM_ID" ]]; then
            echo "::error::Profile Team ID mismatch: got $TEAM expected $EXPECTED_TEAM_ID"
            exit 1
          fi
          if [[ "$APPID" != "${EXPECTED_TEAM_ID}.${BUNDLE_ID}" ]]; then
            echo "::error::Profile App ID mismatch: got $APPID expected ${EXPECTED_TEAM_ID}.${BUNDLE_ID}"
            exit 1
          fi
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Installed provisioning profile name=$NAME uuid=$UUID team=$TEAM appId=$APPID"

      - name: Build signed archive
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/ATDDConnect.xcarchive"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: |
          set -euo pipefail
          EXPORT_DIR="$RUNNER_TEMP/ipa"
          mkdir -p "$EXPORT_DIR"
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          /usr/bin/plutil -create xml1 "$EXPORT_PLIST"
          /usr/bin/plutil -insert method -string app-store-connect "$EXPORT_PLIST"
          /usr/bin/plutil -insert destination -string export "$EXPORT_PLIST"
          /usr/bin/plutil -insert signingStyle -string manual "$EXPORT_PLIST"
          /usr/bin/plutil -insert teamID -string "$IOS_TEAM_ID" "$EXPORT_PLIST"
          /usr/bin/plutil -insert uploadSymbols -bool true "$EXPORT_PLIST"
          /usr/bin/plutil -insert compileBitcode -bool false "$EXPORT_PLIST"
          /usr/bin/plutil -insert provisioningProfiles -dictionary "$EXPORT_PLIST"
          /usr/bin/plutil -insert "provisioningProfiles.$BUNDLE_ID" -string "$PROFILE_NAME" "$EXPORT_PLIST"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_PLIST"
          IPA=$(find "$EXPORT_DIR" -name '*.ipa' | head -n 1)
          test -n "$IPA"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          echo "Exported IPA: $IPA ($(du -h "$IPA" | awk '{print $1}'))"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: atdd-connect-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        uses: apple-actions/upload-testflight-build@v2
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY }}
